name: Build núcleo PS2 (libretro, arm64)
# Compila um núcleo libretro de PS2 para Android arm64 e publica o .so como artifact.
# Sem receita oficial verificada: se falhar, leia o log do passo "Descobrir" e ajuste os inputs.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repositório do núcleo (GPL)"
        default: "ARMSX2/ARMSX2"
      ref:
        description: "Branch/tag (vazio = padrão)"
        default: ""
      cmake_flags:
        description: "Flags extras do CMake para ativar o núcleo libretro"
        default: "-DBUILD_LIBRETRO_CORE=ON"
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Clonar núcleo
        run: |
          git clone --recursive ${{ github.event.inputs.ref && format('--branch {0}', github.event.inputs.ref) || '' }} \
            https://github.com/${{ github.event.inputs.repo }} core
      - name: Descobrir como compilar o libretro
        working-directory: core
        run: |
          echo "== menções a libretro nos CMakeLists =="
          grep -rIn -i "libretro" --include=CMakeLists.txt --include=*.cmake . | head -40 || true
          echo "== workflows do próprio repo =="
          ls .github/workflows 2>/dev/null || true
          grep -rIn -i "libretro" .github 2>/dev/null | head -40 || true
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache cmake git pkg-config
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: core-ccache-${{ github.run_id }}
          restore-keys: core-ccache-
      - name: Configurar (NDK arm64)
        working-directory: core
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            ${{ github.event.inputs.cmake_flags }}
      - name: Compilar
        working-directory: core
        run: cmake --build build --parallel
      - name: Localizar .so
        run: |
          mkdir -p out
          find core/build -name "*libretro*.so" -exec cp -v {} out/ \;
          ls -la out
          test -n "$(ls out)" || { echo "Nenhum .so libretro encontrado"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-ps2-arm64
          path: out/*.so
