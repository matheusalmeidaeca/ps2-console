name: Build núcleo PS2 (ARMSX2 libretro, Android arm64)
# Receita baseada no .gitlab-ci.yml do próprio ARMSX2 (job android arm64-v8a).
# Publica o resultado na release "core"; o workflow "Build APK" baixa de lá.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag do ARMSX2 (vazio = padrão)"
        default: ""
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NDK_VERSION: "29.0.14206865"
      API_LEVEL: "28"
    steps:
      - name: Espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Clonar ARMSX2
        run: |
          git clone --recursive ${{ github.event.inputs.ref && format('--branch {0}', github.event.inputs.ref) || '' }} \
            https://github.com/ARMSX2/ARMSX2 core
      - name: Instalar NDK e ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git ca-certificates ccache
          yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null || true
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
      - uses: actions/cache@v4
        id: deps
        with:
          path: ~/deps
          key: android-deps-arm64-${{ hashFiles('core/.github/workflows/scripts/android/build-dependencies.sh') }}
      - name: Compilar dependências (shaderc, SDL, png...)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          ANDROID_NDK="$NDK" ANDROID_ABI=arm64-v8a ANDROID_API=$API_LEVEL \
            ./.github/workflows/scripts/android/build-dependencies.sh "$HOME/deps"
      - name: Configurar
        working-directory: core
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$API_LEVEL -DANDROID_STL=c++_static \
            -DCMAKE_PREFIX_PATH=$HOME/deps -DCMAKE_FIND_ROOT_PATH=$HOME/deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_GSRUNNER=OFF -DENABLE_TESTS=OFF -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF -DUSE_BACKTRACE=OFF -DX11_API=OFF -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE -DARMSX2_ANDROID_HOST_PAGE_SIZE=0x1000 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
      - name: Compilar núcleo
        working-directory: core
        run: cmake --build build --target pcsx2-libretro --parallel
      - name: Empacotar
        run: |
          SO=$(find core -name armsx2_libretro.so | head -1)
          test -n "$SO" || { echo "armsx2_libretro.so nao encontrado"; exit 1; }
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded "$SO"
          mkdir -p pkg/app/src/main/jniLibs/arm64-v8a pkg/app/src/main/assets
          cp -v "$SO" pkg/app/src/main/jniLibs/arm64-v8a/libarmsx2_libretro.so
          cp -r core/bin/resources pkg/app/src/main/assets/resources
          (cd pkg && zip -qr ../core-android-arm64.zip app)
          ls -la core-android-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-ps2-arm64
          path: core-android-arm64.zip
      - name: Publicar na release "core"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view core >/dev/null 2>&1 || gh release create core --title "Núcleo PS2" --notes "Núcleo ARMSX2 libretro (arm64)"
          gh release upload core core-android-arm64.zip --clobber
